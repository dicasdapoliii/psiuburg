<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cozinha - {{ nome_loja }}</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --amarelo: #ffc107; --verde: #28a745; --azul: #17a2b8; --vermelho: #dc3545; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #f1f1f1; padding: 16px; }

        #telaBloqueio {
            position: fixed; inset: 0; background: #0e0e0e; z-index: 100;
            display: flex; justify-content: center; align-items: center; padding: 16px;
        }
        .box-login-adm {
            background: var(--card); border: 2px solid var(--amarelo); border-radius: 16px;
            padding: 26px; width: 100%; max-width: 360px; text-align: center;
        }
        .box-login-adm input {
            width: 100%; padding: 12px; margin: 14px 0; background: #111; border: 1px solid #444;
            color: #fff; border-radius: 8px; font-size: 16px; text-align: center;
        }

        /* Aviso flutuante de salvamento */
        #toastAviso {
            position: fixed; top: 18px; right: 18px; z-index: 200;
            background: #144d25; color: #fff; border: 1px solid #4cd964;
            padding: 12px 18px; border-radius: 10px; font-weight: bold; font-size: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: none;
        }

        .topo {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 10px; padding-bottom: 14px; border-bottom: 2px solid var(--amarelo); margin-bottom: 14px;
        }
        .topo h1 { color: var(--amarelo); font-size: 22px; }
        .botoes-topo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 12px; font-weight: bold; font-size: 13px; }
        .btn-amarelo { background: var(--amarelo); color: #000; }
        .btn-verde { background: var(--verde); color: #fff; }
        .btn-ton { background: #00a868; color: #fff; }
        .btn-azul { background: var(--azul); color: #fff; }
        .btn-laranja { background: #fd7e14; color: #fff; }
        .btn-roxo { background: #6f42c1; color: #fff; }
        .btn-cinza { background: #333; color: #fff; }
        .btn-vermelho { background: var(--vermelho); color: #fff; }

        .chk-whats-bar {
            background: #14281b; border: 1px solid #28a745; padding: 8px 14px;
            border-radius: 10px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
        }

        .abas { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .aba-btn { background: #262626; color: #ccc; padding: 10px 18px; border-radius: 8px; }
        .aba-btn.ativa { background: var(--amarelo); color: #000; }

        .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
        .card-pedido {
            background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 14px;
            border-left: 5px solid var(--amarelo);
        }
        .card-pedido.status-Concluído { opacity: 0.65; border-left-color: #666; }
        .card-pedido.status-Cancelado { opacity: 0.5; border-left-color: var(--vermelho); }
        .card-pedido.status-Aceito { border-left-color: var(--azul); }
        .card-pedido.status-EmPreparo { border-left-color: #fd7e14; }
        .card-pedido.status-SaiuparaEntrega { border-left-color: var(--verde); }

        .cab-pedido { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
        .badge { padding: 3px 9px; border-radius: 12px; font-size: 12px; background: #333; color: var(--amarelo); }
        .badge-pago { background: #144d25; color: #4cd964; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-aguardando { background: #4a3500; color: #ffc107; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-entrega { background: #2b2b2b; color: #ccc; padding: 3px 8px; border-radius: 8px; font-size: 12px; }

        .itens-lista { background: #141414; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 13px; }
        .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .box-entregador-card {
            display: flex; gap: 6px; margin-top: 8px; align-items: center;
            background: #161224; padding: 8px; border-radius: 8px; border: 1px solid #3f2b75;
        }
        .box-entregador-card select {
            flex: 1; background: #111; color: #fff; border: 1px solid #444; padding: 7px; border-radius: 6px; font-size: 12px;
        }

        .painel-form { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 18px; max-width: 780px; }
        .painel-form input, .painel-form select {
            width: 100%; padding: 10px; margin: 6px 0 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px;
        }
        .linha-item {
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 10px; background: #181818; border-radius: 8px; margin-bottom: 6px;
        }
        .thumb-adm { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid #444; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 14px 0 20px; }
        .kpi-card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 16px; }
        .kpi-card small { color: #aaa; font-size: 12px; }
        .kpi-valor { font-size: 24px; font-weight: 900; margin-top: 6px; }
